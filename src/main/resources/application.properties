spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Redis (JWT blacklist)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
app.jwt.secret=${JWT_SECRET}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Routes are defined in GatewayConfig.java
spring.cloud.gateway.discovery.locator.enabled=false

# --- Actuator / Prometheus metrics ---
# The management server listens on its own port, which docker-compose never
# publishes, so /actuator is reachable only from inside the compose network.
# This matters most here: JwtAuthenticationFilter is a GlobalFilter, so it runs
# only on routed requests and would not guard /actuator on the published 8080.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
# Server-side histogram buckets, so Grafana can compute true p95/p99 rather
# than averaging pre-computed percentiles across instances.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
